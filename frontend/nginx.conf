gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets (Vite content-hashes the filename): safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated or a stale shell would keep pointing at a
    # since-replaced hashed asset.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: React Router owns client-side routes like /compare.
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy to the backend. Buffering and caching are off and the read timeout is long
    # because GET /api/jobs/{id}/events is a long-lived Server-Sent-Events stream: nginx must
    # forward each chunk as the backend writes it, not wait to fill a buffer.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 600m;
    }
}
