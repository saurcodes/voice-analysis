[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "praat-parselmouth>=0.4.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "faster-whisper>=1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "PyJWT[crypto]>=2.9",
  "httpx>=0.27",
  "anthropic>=1.11",
  "itsdangerous>=2.2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "testcontainers[postgres]>=4.0", "httpx2>=2.13", "pytest-httpx>=0.36"]

[tool.setuptools.packages.find]
include = ["vocal_coach*"]

[tool.setuptools.package-data]
"vocal_coach.llm.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
