[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "praat-parselmouth>=0.4.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vocal_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
