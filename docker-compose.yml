services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocal}
      POSTGRES_DB: vocal_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocal} -d vocal_coach"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-vocal}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-vocal}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    volumes:
      # Dev realm (demo user, password grant for scripts/smoke.sh) unless KEYCLOAK_REALM_FILE says otherwise.
      - ${KEYCLOAK_REALM_FILE:-./keycloak/realm-export.dev.json}:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 needs a Host header (HTTP/1.0 without one → NPE in getRealm); the image has no curl.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/vocal-coach HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"realm\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocal}:${POSTGRES_PASSWORD:-vocal}@postgres:5432/vocal_coach
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/vocal-coach}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-vocal-coach-web}
      KEYCLOAK_JWKS_URL_OVERRIDE: http://keycloak:8080/realms/vocal-coach/protocol/openid-connect/certs
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATA_DIR: /data
      JOB_WORKERS: ${JOB_WORKERS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # The browser round trip for the OAuth callback stays on the frontend origin, through the
      # nginx /api proxy, so this defaults to :3000 (compose) rather than the backend's own :8000.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/drive/callback}
      # config.yaml's llm.base_url defaults to a local Ollama at localhost:11434, which does not
      # resolve inside the container; this points it at the host instead (see backend/README.md).
      LLM_BASE_URL_OVERRIDE: ${LLM_BASE_URL_OVERRIDE-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/data
      - models:/models
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-vocal-coach}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-vocal-coach-web}
    ports: ["3000:80"]
    depends_on:
      - backend

volumes:
  pgdata:
  appdata:
  models:
